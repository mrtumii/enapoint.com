[build]
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Pretty URLs: /products resolves to /products.html
[build.processing]
  skip_processing = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(self)"
    # Every page loads its scripts from /assets/js and its fonts from Google.
    # There is no inline JS anywhere; style-src needs 'unsafe-inline' only
    # because the markup uses style="" attributes for one-off layout nudges.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# The console is not a place for search engines or framing.
[[headers]]
  for = "/dashboard"
  [headers.values]
    X-Robots-Tag = "noindex"

# Canonicalise on the www host: every page's <link rel="canonical"> and og:url
# already points at https://www.enapoint.com, so the bare apex must not serve a
# duplicate copy of the site. Netlify adds this redirect itself once www is the
# primary domain; keeping it here makes it explicit and survives a primary swap.
[[redirects]]
  from = "https://enapoint.com/*"
  to = "https://www.enapoint.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/console"
  to = "/dashboard"
  status = 301

[[redirects]]
  from = "/register-meter"
  to = "/register"
  status = 301

[[redirects]]
  from = "/docs"
  to = "/developers"
  status = 302

# Partner tooling (Swagger UI, Postman, code generators) fetches the spec cross-origin.
[[headers]]
  for = "/openapi.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"
